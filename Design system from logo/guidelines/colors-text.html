<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Texto e superfícies</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.lbl{font:var(--type-caption);color:var(--text-muted);margin-top:6px}.lbl b{display:block;color:var(--text-body);font-weight:600}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--text-heading)"></div><div class="lbl"><b>heading</b>--text-heading</div></div><div class="sw"><div class="chip" style="background:var(--text-body)"></div><div class="lbl"><b>body</b>--text-body</div></div><div class="sw"><div class="chip" style="background:var(--text-muted)"></div><div class="lbl"><b>muted</b>--text-muted</div></div><div class="sw"><div class="chip" style="background:var(--text-link)"></div><div class="lbl"><b>link</b>--text-link</div></div><div class="sw"><div class="chip" style="background:var(--surface-subtle)"></div><div class="lbl"><b>subtle</b>--surface-subtle</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse)"></div><div class="lbl"><b>inverse</b>--surface-inverse</div></div><div class="sw"><div class="chip" style="background:var(--border-default)"></div><div class="lbl"><b>border</b>--border-default</div></div><div class="sw"><div class="chip" style="background:var(--border-focus)"></div><div class="lbl"><b>focus</b>--border-focus</div></div></div></body></html>
