<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Raios e bordas</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.lbl{font:var(--type-caption);color:var(--text-muted);margin-top:6px}.lbl b{display:block;color:var(--text-body);font-weight:600}</style></head><body><div class="row"><div class="sw"><div style="height:56px;border:2px solid var(--lm-navy-700);border-radius:var(--radius-xs);background:var(--lm-navy-50)"></div><div class="lbl"><b>radius-xs</b>2px</div></div><div class="sw"><div style="height:56px;border:2px solid var(--lm-navy-700);border-radius:var(--radius-md);background:var(--lm-navy-50)"></div><div class="lbl"><b>radius-md</b>4px</div></div><div class="sw"><div style="height:56px;border:2px solid var(--lm-navy-700);border-radius:var(--radius-lg);background:var(--lm-navy-50)"></div><div class="lbl"><b>radius-lg</b>6px</div></div><div class="sw"><div style="height:56px;border:2px solid var(--lm-navy-700);border-radius:var(--radius-pill);background:var(--lm-navy-50)"></div><div class="lbl"><b>radius-pill</b>999px</div></div><div class="sw"><div style="height:56px;box-shadow:var(--shadow-md);border-radius:var(--radius-md);background:#fff"></div><div class="lbl"><b>shadow-md</b>elevação</div></div><div class="sw"><div style="height:56px;box-shadow:var(--shadow-focus);border-radius:var(--radius-md);background:#fff"></div><div class="lbl"><b>shadow-focus</b>foco</div></div></div></body></html>
