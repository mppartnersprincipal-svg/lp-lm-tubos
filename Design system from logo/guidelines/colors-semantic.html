<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Semânticas</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.lbl{font:var(--type-caption);color:var(--text-muted);margin-top:6px}.lbl b{display:block;color:var(--text-body);font-weight:600}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--color-success)"></div><div class="lbl"><b>success</b>--color-success</div></div><div class="sw"><div class="chip" style="background:var(--color-warning)"></div><div class="lbl"><b>warning</b>--color-warning</div></div><div class="sw"><div class="chip" style="background:var(--color-danger)"></div><div class="lbl"><b>danger</b>--color-danger</div></div><div class="sw"><div class="chip" style="background:var(--color-info)"></div><div class="lbl"><b>info</b>--color-info</div></div><div class="sw"><div class="chip" style="background:var(--color-whatsapp)"></div><div class="lbl"><b>whatsapp</b>--color-whatsapp</div></div></div></body></html>
