<!-- @dsCard group="Spacing" viewport="700x200" subtitle="Durações, easings e elevações de hover" name="Motion" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.row{display:flex;gap:12px;flex-wrap:wrap}.b{flex:1 1 120px;padding:14px;background:var(--surface-tint);border-radius:var(--radius-lg);cursor:pointer;display:grid;gap:6px;transition:transform var(--dur-base) var(--ease-spring),box-shadow var(--dur-base)}.b:hover{transform:var(--lift);box-shadow:var(--shadow-md)}.b b{font:var(--type-label)}.b span{font:var(--type-caption);color:var(--text-muted)}.dot{width:14px;height:14px;border-radius:50%;background:var(--color-primary);animation:mv 1.6s infinite}@keyframes mv{0%,100%{transform:translateX(0)}50%{transform:translateX(90px)}}</style></head><body><div class="row">
<div class="b"><div class="dot" style="animation-timing-function:var(--ease-standard)"></div><b>--ease-standard</b><span>(.2,0,0,1) · transições de cor</span></div>
<div class="b"><div class="dot" style="animation-timing-function:var(--ease-out)"></div><b>--ease-out</b><span>(0,0,.2,1) · reveal, altura</span></div>
<div class="b"><div class="dot" style="animation-timing-function:var(--ease-spring)"></div><b>--ease-spring</b><span>(.34,1.56,.64,1) · hover lift, ícones</span></div>
<div class="b"><b>Durações</b><span>fast 120 · base 220 · slow 420 · reveal 700ms</span><b style="margin-top:6px">Hover</b><span>lift -2px + sombra colorida (--shadow-primary/secondary/whatsapp)</span></div>
</div></body></html>
