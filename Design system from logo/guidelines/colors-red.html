<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Escala vermelho</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.lbl{font:var(--type-caption);color:var(--text-muted);margin-top:6px}.lbl b{display:block;color:var(--text-body);font-weight:600}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--lm-red-50)"></div><div class="lbl"><b>red-50</b>--lm-red-50</div></div><div class="sw"><div class="chip" style="background:var(--lm-red-100)"></div><div class="lbl"><b>red-100</b>--lm-red-100</div></div><div class="sw"><div class="chip" style="background:var(--lm-red-300)"></div><div class="lbl"><b>red-300</b>--lm-red-300</div></div><div class="sw"><div class="chip" style="background:var(--lm-red-500)"></div><div class="lbl"><b>red-500</b>--lm-red-500</div></div><div class="sw"><div class="chip" style="background:var(--lm-red-600)"></div><div class="lbl"><b>red-600</b>--lm-red-600</div></div><div class="sw"><div class="chip" style="background:var(--lm-red-700)"></div><div class="lbl"><b>red-700</b>--lm-red-700</div></div></div></body></html>
