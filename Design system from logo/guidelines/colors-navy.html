<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Escala azul-marinho</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.lbl{font:var(--type-caption);color:var(--text-muted);margin-top:6px}.lbl b{display:block;color:var(--text-body);font-weight:600}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--lm-navy-50)"></div><div class="lbl"><b>navy-50</b>--lm-navy-50</div></div><div class="sw"><div class="chip" style="background:var(--lm-navy-100)"></div><div class="lbl"><b>navy-100</b>--lm-navy-100</div></div><div class="sw"><div class="chip" style="background:var(--lm-navy-300)"></div><div class="lbl"><b>navy-300</b>--lm-navy-300</div></div><div class="sw"><div class="chip" style="background:var(--lm-navy-500)"></div><div class="lbl"><b>navy-500</b>--lm-navy-500</div></div><div class="sw"><div class="chip" style="background:var(--lm-navy-700)"></div><div class="lbl"><b>navy-700</b>--lm-navy-700</div></div><div class="sw"><div class="chip" style="background:var(--lm-navy-800)"></div><div class="lbl"><b>navy-800</b>--lm-navy-800</div></div><div class="sw"><div class="chip" style="background:var(--lm-navy-900)"></div><div class="lbl"><b>navy-900</b>--lm-navy-900</div></div></div></body></html>
