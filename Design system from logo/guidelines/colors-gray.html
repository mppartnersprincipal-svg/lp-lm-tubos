<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Neutros</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1 1 90px;min-width:90px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.lbl{font:var(--type-caption);color:var(--text-muted);margin-top:6px}.lbl b{display:block;color:var(--text-body);font-weight:600}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--lm-gray-0)"></div><div class="lbl"><b>gray-0</b>--lm-gray-0</div></div><div class="sw"><div class="chip" style="background:var(--lm-gray-50)"></div><div class="lbl"><b>gray-50</b>--lm-gray-50</div></div><div class="sw"><div class="chip" style="background:var(--lm-gray-100)"></div><div class="lbl"><b>gray-100</b>--lm-gray-100</div></div><div class="sw"><div class="chip" style="background:var(--lm-gray-200)"></div><div class="lbl"><b>gray-200</b>--lm-gray-200</div></div><div class="sw"><div class="chip" style="background:var(--lm-gray-300)"></div><div class="lbl"><b>gray-300</b>--lm-gray-300</div></div><div class="sw"><div class="chip" style="background:var(--lm-gray-500)"></div><div class="lbl"><b>gray-500</b>--lm-gray-500</div></div><div class="sw"><div class="chip" style="background:var(--lm-gray-600)"></div><div class="lbl"><b>gray-600</b>--lm-gray-600</div></div><div class="sw"><div class="chip" style="background:var(--lm-gray-800)"></div><div class="lbl"><b>gray-800</b>--lm-gray-800</div></div><div class="sw"><div class="chip" style="background:var(--lm-gray-900)"></div><div class="lbl"><b>gray-900</b>--lm-gray-900</div></div></div></body></html>
