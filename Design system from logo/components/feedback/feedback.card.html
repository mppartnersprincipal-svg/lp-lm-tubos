<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="https://unpkg.com/lucide@latest"></script><style>body{padding:20px}.g{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:grid;gap:14px}</style></head><body><div id="root"></div>
<script>
// Carrega os componentes-fonte (.jsx) diretamente; em consumo real use window.<Namespace> do _ds_bundle.js
window.__loadDS = async () => {
  const files = [["Button","../core/Button.jsx"],["IconButton","../core/IconButton.jsx"],["Badge","../core/Badge.jsx"],["Tag","../core/Tag.jsx"],["Card","../core/Card.jsx"],["Logo","../core/Logo.jsx"],["Input","../forms/Input.jsx"],["Select","../forms/Select.jsx"],["Checkbox","../forms/Checkbox.jsx"],["Radio","../forms/Radio.jsx"],["Switch","../forms/Switch.jsx"],["Tabs","../navigation/Tabs.jsx"],["Dialog","../feedback/Dialog.jsx"],["Toast","../feedback/Toast.jsx"],["Tooltip","../feedback/Tooltip.jsx"],["ProductCard","../commerce/ProductCard.jsx"]];
  const NS = {}; const srcs = await Promise.all(files.map(([n,u])=>fetch(u).then(r=>r.text())));
  const order = ["Button","Badge"]; // dependências primeiro
  const items = files.map((f,i)=>[f[0],srcs[i]]).sort((a,b)=>order.indexOf(b[0])-order.indexOf(a[0]));
  for (const [n,src] of items) {
    let code = src.replace(/import React from "react";?/,"").replace(/import \{\s*(\w+)\s*\} from "[^"]+";?/g,(m,x)=>"const "+x+"=NS."+x+";").replace(/export function/g,"function")+"\nNS."+n+"="+n+";";
    code = Babel.transform(code,{presets:["react"]}).code;
    new Function("React","NS",code)(React,NS);
  }
  return NS;
};
</script>
<script type="text/babel">
const {Dialog,Toast,Tooltip,Button}=new Proxy({}, {get:(_,k)=>(props)=>React.createElement(NS[k],props)});
function App(){const [o,setO]=React.useState(false);return <div className="col">
 <div className="g"><Toast tone="success" title="Orçamento enviado" description="Retornamos em até 1 hora útil." onClose={()=>{}}/><Toast tone="warning" title="Item sob encomenda" description="Prazo estimado 15 dias."/></div>
 <div className="g"><Toast tone="danger" title="Falha no envio" description="Tente pelo WhatsApp."/><Toast tone="info" title="Frete para Norte/Nordeste" description="Consulte condições."/></div>
 <div className="g"><Button variant="secondary" onClick={()=>setO(true)}>Abrir dialog</Button><Tooltip content="Diâmetro nominal"><span style={{textDecoration:"underline dotted",cursor:"help"}}>DN 2½"</span></Tooltip><Tooltip content="Sistema ranhurado Victaulic-compatível" placement="right"><span style={{textDecoration:"underline dotted",cursor:"help"}}>Ranhurado</span></Tooltip></div>
 <Dialog open={o} title="Pedir orçamento" onClose={()=>setO(false)} footer={<><Button variant="ghost" onClick={()=>setO(false)}>Cancelar</Button><Button>Enviar</Button></>}>Envie sua lista de materiais e retornamos com preço e prazo.</Dialog>
</div>}
__loadDS().then(ns=>{Object.assign(window,{NS:ns});ReactDOM.createRoot(document.getElementById("root")).render(<App/>);});
setTimeout(()=>window.lucide&&lucide.createIcons(),50);
</script></body></html>
