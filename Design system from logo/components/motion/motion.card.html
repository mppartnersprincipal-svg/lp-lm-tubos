<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{padding:20px}.g{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:grid;gap:14px}</style></head><body><div id="root"></div>
<script>
window.__loadDS = async () => {
  const files = [["Button","core"],["Reveal","motion"],["Counter","motion"],["Marquee","motion"],["ScrollProgress","motion"],["StickyCTA","motion"]];
  const NS = {}; const srcs = await Promise.all(files.map(([n,d])=>fetch("../"+d+"/"+n+".jsx").then(r=>r.text())));
  files.forEach(([n],i)=>{ let code=srcs[i].replace(/import React from "react";?/,"").replace(/import \{\s*(\w+)\s*\} from "[^"]+";?/g,(m,x)=>"const "+x+"=NS."+x+";").replace(/export function/g,"function")+"\nNS."+n+"="+n+";"; new Function("React","NS",Babel.transform(code,{presets:["react"]}).code)(React,NS); });
  return NS;
};
</script>
<script type="text/babel">
const {Button,Reveal,Counter,Marquee}=new Proxy({}, {get:(_,k)=>(props)=>React.createElement(NS[k],props)});
function App(){const [k,setK]=React.useState(0);return <div className="col">
 <div className="g"><Button arrow>Pedir orçamento</Button><Button variant="secondary" arrow>Ver produtos</Button><Button variant="whatsapp">WhatsApp</Button><Button loading>Enviando</Button><Button variant="outline" size="sm" onClick={()=>setK(k+1)}>Repetir reveal</Button></div>
 <div key={k} style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>{[0,1,2].map(i=><Reveal key={i} delay={i*120}><div style={{padding:20,background:"var(--surface-tint)",borderRadius:"var(--radius-lg)"}}><div style={{font:"var(--type-h3)",color:"var(--color-primary)"}}><Counter value={[6,27,1200][i]} prefix={i===2?"+":""}/></div><div style={{font:"var(--type-body-sm)",color:"var(--text-muted)"}}>{["anos de mercado","estados atendidos","itens em estoque"][i]}</div></div></Reveal>)}</div>
 <Marquee items={["Tubos","Conexões ranhuradas","Válvulas","Bombas","Sprinklers","Hidrantes","Mangueiras"]} inverse/>
 <div style={{font:"var(--type-caption)",color:"var(--text-muted)"}}>Também no kit: StickyCTA (WhatsApp flutuante + voltar ao topo) e ScrollProgress (barra de leitura) — visíveis em ui_kits/site.</div>
</div>}
__loadDS().then(ns=>{window.NS=ns;ReactDOM.createRoot(document.getElementById("root")).render(<App/>);});
</script></body></html>
